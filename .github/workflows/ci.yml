name: CI

# Both jobs gate `refs/pull/N/merge`, not the branch tip: those differ the
# moment base advances, and the merge result is the thing being merged. That is
# also why `push` is main only -- a branch push and its PR were running `checks`
# twice over near-identical trees -- and why `synchronize` is in the list, since
# without it the emulator job only ever saw a PR's first commit.
#
# A push to a fork does not fire this workflow at all, so a fork PR is covered
# only by the `pull_request` events.
#
# A push to a branch with no PR now runs nothing. Open the PR as a draft: drafts
# fire `opened` and `synchronize` like any other.
on:
  push:
    # Naming `branches` already excludes tag pushes, so release.yml keeps v* to
    # itself without a tags-ignore.
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    # No `paths-ignore`, though the release PR changes nothing the build reads.
    # The `PR` ruleset requires every job below, and a required check from a
    # workflow a path filter skipped stays "expected" forever, so the release
    # PR could not merge (#60). The skip is made per job instead -- see
    # `changes` -- and a job skipped by `if:` reports success.
  workflow_dispatch:

# `github.ref` is refs/pull/N/merge on a PR and refs/heads/main on the only push
# this takes, so one expression collapses both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether a PR changes only the files release-please writes. The build reads
  # none of them (version.txt is read by release.yml's tag guard alone), so
  # `checks` would retest the tree main's push run just tested. The emulator
  # job needs no such gate: affected_suites.py lists all three as INERT.
  #
  # `HEAD^1..HEAD` on the merge commit, as in the emulator job. An empty diff
  # is a diff that failed, not a release PR, so it runs everything.
  changes:
    name: Whether the PR changes only release files
    runs-on: ubuntu-latest
    outputs:
      release-only: ${{ steps.diff.outputs.release-only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2

      - name: Compare the PR against its base
        id: diff
        run: |
          set -euo pipefail
          release_only=false
          if [ "${{ github.event_name }}" = pull_request ]; then
            git rev-parse --verify HEAD^2 >/dev/null
            changed=$(git diff --name-only HEAD^1 HEAD)
            other=$(printf '%s\n' "$changed" \
              | grep -vxE 'CHANGELOG\.md|version\.txt|\.release-please-manifest\.json' || true)
            if [ -n "$changed" ] && [ -z "$other" ]; then
              release_only=true
            fi
          fi
          echo "release-only: $release_only"
          echo "release-only=$release_only" >> "$GITHUB_OUTPUT"

  checks:
    name: Unit tests, lint and the debug APK
    runs-on: ubuntu-latest
    needs: changes
    # Skipped only on a positive answer. A skipped job satisfies the ruleset,
    # and a dependent of a failed job is skipped by default, so without
    # `!cancelled()` a broken `changes` would pass every PR unbuilt.
    if: >-
      !cancelled() &&
      !(needs.changes.result == 'success' && needs.changes.outputs.release-only == 'true')

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-android
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Robolectric resolves its ~190 MiB android-all-instrumented image into
      # ~/.m2 at test runtime, which setup-gradle does not cache: it caches
      # Gradle User Home only.
      #
      # Restored everywhere and saved from `main` only, like setup-gradle's
      # entries: a PR's copy is readable by that PR alone (issue #13).
      - name: Restore the Robolectric SDK image
        id: robolectric-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', '**/robolectric.properties') }}
          restore-keys: robolectric-

      # :app:assembleDebug, not the root assembleDebug: the latter also builds
      # an AAR per library module that nothing here consumes.
      # processReleaseMainManifest is the shipped manifest the permission guard
      # reads -- a manifest merge, no dexing or signing.
      - name: Unit tests, lint and assemble
        run: >-
          ./gradlew --stacktrace
          test lint :app:assembleDebug :app:processReleaseMainManifest

      # After the tests, which are what download the image.
      - name: Save the Robolectric SDK image
        if: github.ref == 'refs/heads/main' && steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-cache.outputs.cache-primary-key }}

      - name: The shipped permission surface is exactly what is declared
        run: python3 .github/scripts/check_permissions.py

      # Here rather than in release.yml, where a test cannot fail usefully: by
      # then a tag exists and a keystore is decrypted. The fixtures are built
      # by the test, so this passes on the shallow checkout above.
      - name: The release notes are built from the tag they claim
        run: bash .github/scripts/release_notes_test.sh

      # A suite this selects wrongly is skipped with a green run, so the rules
      # are tested here, against this repository's own module graph.
      - name: The emulator job chooses the suites a change can reach
        run: python3 .github/scripts/affected_suites_test.py

      # Room only rewrites the schema when the committed file's identity hash
      # differs from the entities, so a drifted `createSql` under an unchanged
      # hash survives every build and the comparison is against itself.
      #
      # Deleting the file is not enough either: `room.schemaLocation` is a raw
      # KSP argument, not a declared task output, so KSP comes back FROM-CACHE
      # and the guard reports a deletion on a PR that changed nothing. Hence its
      # own invocation with a forced rerun -- `--rerun`, which scopes to the
      # requested task, not `--rerun-tasks`, which invalidates all fourteen.
      #
      # Only the current version's file goes. An older one is a released
      # schema, which the entities no longer describe and Room cannot write: it
      # reads it, to generate the auto-migration from that version, and with
      # `1.json` deleted KSP fails "Schema '1.json' required for migration was
      # not found".
      - name: Regenerate the exported schema from the entities
        run: |
          version=$(sed -n 's/^ *const val VERSION = \([0-9]*\)$/\1/p' \
            core/data/src/main/kotlin/my/pinged/data/PingedDatabase.kt)
          test -n "$version" || { echo "::error::PingedDatabase.VERSION not found"; exit 1; }
          rm -f "core/data/schemas/my.pinged.data.PingedDatabase/$version.json"
          ./gradlew --stacktrace :core:data:kspDebugKotlin --rerun

      # No pathspec: naming core/data/schemas would quietly exempt the second
      # module to export one. Porcelain covers modified, deleted and untracked;
      # the diff runs first only for its message.
      - name: No committed generated file drifted
        run: |
          if ! git diff --exit-code; then
            echo "::error::A committed generated file differs from what this build produced. If it is the Room schema, the entities changed without exporting it, or without bumping the database version and writing a migration."
            exit 1
          fi
          untracked=$(git status --porcelain)
          if [ -n "$untracked" ]; then
            echo "::error::This build left files in the tree that version control does not know about. Either commit them or add them to .gitignore:"
            echo "$untracked"
            exit 1
          fi

      - name: Keep the reports from a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.job }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 14

  instrumented:
    name: Instrumented tests on an emulator (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # `draft == false` is what keeps a draft PR usable as a branch's CI now that
    # branch pushes run nothing: a draft gets unit tests and lint on every push
    # and the emulator not at all, until `ready_for_review`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.draft == false) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    # One emulator per runner, each running its shard of the suites; the split
    # and the measurements behind it are SHARDS in affected_suites.py, which a
    # test holds to this list. Not several emulators on one runner: a starved
    # guest misses render timeouts, which is how CI flakes were reproduced.
    #
    # fail-fast off for the reason `--continue` is on below: one shard's flake
    # must not cancel the others' results.
    strategy:
      fail-fast: false
      matrix:
        shard: [ledger-1, ledger-2, data-app-capture, smoke]

    # Defined once because the two emulator steps have to agree exactly: pass
    # them different options and the second discards the snapshot and cold-boots
    # while still reporting a cache hit.
    #
    # google_apis, not google_apis_playstore: a Play Store image cannot be
    # rooted, boots slower, and is not reliably published for the newest API on
    # hosted runners. A test that fails here but passes locally -- where the
    # emulator is android-37.1 -- should be checked against that first.
    env:
      API_LEVEL: '36'
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none

    steps:
      # Depth 2 for the merge commit's first parent, the base it is tested
      # against; see the step below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # A PR runs only the suites its change can reach through the module
      # graph -- the rules are affected_suites.py's -- and of those, only this
      # shard's. Main runs every suite, which is what catches anything a rule
      # there let a PR skip.
      #
      # `HEAD^1..HEAD` on the merge commit GitHub checks out is exactly what
      # the PR adds to the base as it is now, with no stale base SHA. A diff
      # that fails stops the job: pipefail, and the script runs every suite on
      # an empty list.
      - name: Choose the instrumented suites
        id: suites
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            git rev-parse --verify HEAD^2 >/dev/null
            git diff --name-only HEAD^1 HEAD \
              | python3 .github/scripts/affected_suites.py --shard ${{ matrix.shard }}
          else
            echo "Every suite: ${{ github.event_name }} on ${{ github.ref }}"
            python3 .github/scripts/affected_suites.py --all --shard ${{ matrix.shard }}
          fi

      - uses: ./.github/actions/setup-android
        if: steps.suites.outputs.tasks != ''
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Enable KVM
        if: steps.suites.outputs.tasks != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cold boot measured 76.5s; from the snapshot, 12s. No restore-keys and
      # nothing here for EMULATOR_OPTIONS: a near-miss restore is worse than a
      # miss, because the emulator falls back to a cold boot while the cache
      # reports a hit. Change the options and bump the v1.
      #
      # The system image is not cached as well, though installing it is a
      # further 70s. Both together are ~4 GiB against a 10 GB repository budget
      # the Gradle caches also draw on.
      #
      # Saved from `main` only. A PR's 2.5 GB copy would be readable by that PR
      # alone, and two of them overflow the budget and evict `main`'s
      # (issue #13).
      - name: Restore the AVD and its boot snapshot
        if: steps.suites.outputs.tasks != ''
        id: avd-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v1-${{ env.API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}

      # Boots and does nothing, so the shutdown leaves a snapshot.
      # `disable-animations: false` because the step below applies that per boot
      # rather than baking it in.
      - name: Create the AVD and its boot snapshot
        if: steps.suites.outputs.tasks != '' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          disable-animations: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          script: echo "Booted once so the shutdown leaves a snapshot behind."

      # Straight after the boot that made it, before the tests can touch the
      # device and whether or not they pass.
      - name: Save the AVD and its boot snapshot
        if: steps.suites.outputs.tasks != '' && github.ref == 'refs/heads/main' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      # `-no-snapshot-save` so a run that dirtied the device does not write that
      # state back over the clean snapshot.
      - name: Instrumented tests
        if: steps.suites.outputs.tasks != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          # `--continue` so one suite's failure does not cancel the others:
          # the list starts with :app, and a flake there stopped :feature:capture,
          # :feature:ledger and :smoke from running at all (#17's run 37209862807).
          script: ./gradlew --stacktrace --continue ${{ steps.suites.outputs.tasks }}

      # A runner that dies before its first test is a green task with an empty
      # report: measured, when :app's suite was pointed at R8's output.
      - name: The smoke test ran
        if: steps.suites.outputs.smoke == 'true'
        run: |
          if ! grep -q 'tests="[1-9]' smoke/build/outputs/androidTest-results/connected/minified/*.xml; then
            echo "::error:::smoke reported no tests. Its runner died before the first one, so nothing has checked the R8 build."
            exit 1
          fi

      - name: Keep the reports from a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.job }}-${{ matrix.shard }}
          path: |
            **/build/reports/**
            **/build/outputs/androidTest-results/**
          retention-days: 14

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest

    # The four signing secrets are environment secrets, not repository ones,
    # and a job that does not name its environment reads them as empty. The
    # guard below then fails naming all four while the repository's secrets
    # page shows all four present, which is a long way to go for a typo.
    #
    # Environment rather than repository scope is the point rather than an
    # accident: this environment's deployment rule admits only `v*`, so the
    # keystore is unreachable from a run on any other ref. A workflow file is
    # a file anyone with push access can edit, and repository secrets would be
    # readable from whatever that edit said.
    environment: release

    steps:
      # Full history, because the notes step reads the range between this tag
      # and the previous one. Checkout's default is a depth-1 fetch of the
      # pushed ref alone: every earlier tag absent and every earlier commit
      # unreachable, which is not an error the notes step could detect --
      # `git tag --list` on a clone with one tag succeeds and says there is no
      # previous release, so a shallow checkout would publish every release as
      # if it were the first. fetch-tags is named although fetch-depth: 0
      # already implies it, because the pair is what has to stay true and the
      # depth is the half someone would think to reduce.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check the Android project exists
        run: |
          if [ ! -f gradlew ]; then
            echo "::error::No gradlew at the repository root. The Android project has not been created yet, so there is nothing to build. See docs/release.md."
            exit 1
          fi

      # No cache-encryption-key here, unlike ci.yml, and the omission is the
      # point: with one, setup-gradle uploads this job's configuration-cache
      # data to the Actions cache, and this is the one job that reads the
      # keystore password at configuration time. Encrypted or not, signing
      # material has no reason to leave the runner to save seconds on a build
      # that happens a few times a year. The dependency cache still applies.
      - uses: ./.github/actions/setup-android

      - name: Check the release secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the 'release' environment:$missing. They are environment secrets, so check the environment and not the repository secrets page. See docs/release.md."
            exit 1
          fi

      - name: Run the parse corpus and unit tests
        run: ./gradlew --stacktrace test

      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pinged-release.jks"
          if [ ! -s "$RUNNER_TEMP/pinged-release.jks" ]; then
            echo "::error::KEYSTORE_BASE64 did not decode to a file. Re-encode with: base64 -w0 pinged-release.jks"
            exit 1
          fi

      # PINGED_VERSION is the tag without its leading `v`, and it is what the
      # build reads for versionCode and versionName. Without it the build
      # produces 0.0.0-dev, code 1 -- which is what a build that is not a
      # release should say, and is caught by the step below if it ever reaches
      # here.
      - name: Build the signed release APK
        env:
          PINGED_KEYSTORE_FILE: ${{ runner.temp }}/pinged-release.jks
          PINGED_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PINGED_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PINGED_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export PINGED_VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --stacktrace assembleRelease

      # The APK is named after the tag and the manifest by the build, and they
      # used to be able to disagree -- the file name is the half nobody checks
      # against a phone -- so this fails before anything is uploaded.
      #
      # Both fields, and versionCode is the one that matters: it is the only
      # thing Android compares, so an APK with the right name and a stale code
      # is an update the package manager will not treat as one. The first
      # version of this step extracted the code, printed it, and compared only
      # the name.
      - name: The APK says the version the tag says
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(find app/build/intermediates/merged_manifest/release -name AndroidManifest.xml | head -1)
          if [ -z "$manifest" ]; then
            echo "::error::No release merged manifest to check."
            exit 1
          fi
          name=$(grep -o 'android:versionName="[^"]*"' "$manifest" | cut -d'"' -f2)
          code=$(grep -o 'android:versionCode="[^"]*"' "$manifest" | cut -d'"' -f2)
          # The same packing app/build.gradle.kts does, restated here on
          # purpose: a guard that derives its expectation from the thing it is
          # guarding cannot fail.
          expected_code=$(echo "$version" | awk -F. '{ print $1 * 10000 + $2 * 100 + $3 }')
          echo "tag $version, manifest $name (code $code, expected $expected_code)"
          if [ "$name" != "$version" ]; then
            echo "::error::Tag v$version built an APK that calls itself $name. PINGED_VERSION did not reach the build."
            exit 1
          fi
          if [ "$code" != "$expected_code" ]; then
            echo "::error::Tag v$version should build versionCode $expected_code and built $code. versionCode is the only field Android compares, so this APK would not read as an update."
            exit 1
          fi

      - name: Name the artifacts after the tag
        id: stage
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          apk=$(find app/build/outputs/apk/release -name '*.apk' -not -name '*unsigned*' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::No signed APK found under app/build/outputs/apk/release. Is signingConfigs.release wired up? See docs/release.md."
            exit 1
          fi
          cp "$apk" "out/pinged-$version.apk"
          mapping=$(find app/build/outputs/mapping/release -name 'mapping.txt' 2>/dev/null | head -1)
          if [ -n "$mapping" ]; then
            cp "$mapping" "out/pinged-$version-mapping.txt"
          fi
          {
            echo "version=$version"
            echo "sha256=$(sha256sum "out/pinged-$version.apk" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
          ls -la out

      # The notes are built by a script rather than inline, so that the one
      # step nobody can rehearse is the one step that can be run by hand:
      # `.github/scripts/release_notes.sh v0.1.0 deadbeef /tmp/notes.md` in a
      # clone renders exactly what a release would publish, with no keystore
      # and no tag push. The static half of the notes moved in there with the
      # generated half; splitting them would mean editing two files to change
      # one document.
      - name: Write the release notes
        env:
          APK_SHA256: ${{ steps.stage.outputs.sha256 }}
        run: bash .github/scripts/release_notes.sh "$GITHUB_REF_NAME" "$APK_SHA256" notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          cat notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "Pinged $VERSION" \
            --notes-file notes.md \
            out/*

      - name: Shred the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pinged-release.jks"

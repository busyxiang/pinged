# The defaults (512 MiB heap, 384 MiB metaspace) exhausted metaspace mid-run on
# a :core:data instrumented build -- Room's KSP processor, AGP and the Kotlin
# compiler share one daemon -- and reported it as "Could not receive a message
# from the daemon", which reads like a build bug rather than a resource limit.
#
# The heap is held to 2g because a daemon grows to whatever it is allowed, and
# several sessions' builds each start one: at 3g they held 3.4-4.4G apiece. On
# 2026-10-15, with Kotlin compiled in its own daemon, a --rerun-tasks build of
# every debug and test source set ran out of heap in D8 at 1536m; at 2g it
# passed, as did CI's checks command (most after a GC: 1294M, no full GC).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build

# Otherwise the Kotlin daemon inherits the 2g above. The same build compiled
# at 1g, 1536m and 2g in 55s each, its heap at most 664-793M after a GC, so
# 1536m is twice what it kept and 1g too close to it. One Kotlin daemon serves
# every build that asks for no more memory than it has.
kotlin.daemon.jvmargs=-Xmx1536m

# Fifteen minutes idle, not Gradle's three hours: a daemon a session's build
# started otherwise holds its heap long after that session has moved on. The
# cost is a cold daemon for the first build after a quiet spell.
org.gradle.daemon.idletimeout=900000

org.gradle.caching=true
org.gradle.parallel=true

# A cold CI job spends 2m20s configuring, longer than the compile that follows,
# and configuration is identical from run to run. Across runs the entry is only
# restored when setup-gradle has an encryption key.
org.gradle.configuration-cache=true

android.useAndroidX=true

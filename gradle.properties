# The defaults (512 MiB heap, 384 MiB metaspace) exhausted metaspace mid-run on
# a :core:data instrumented build -- Room's KSP processor, AGP and the Kotlin
# compiler share one daemon -- and reported it as "Could not receive a message
# from the daemon", which reads like a build bug rather than a resource limit.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build

org.gradle.caching=true
org.gradle.parallel=true

# A cold CI job spends 2m20s configuring, longer than the compile that follows,
# and configuration is identical from run to run. Across runs the entry is only
# restored when setup-gradle has an encryption key.
org.gradle.configuration-cache=true

android.useAndroidX=true

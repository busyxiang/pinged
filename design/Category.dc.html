<!doctype html>
<html>

<body>
<x-dc>
<helmet>

<style>

<div style="width: 390px; height: 844px; background: #efe7d8; font-family: Karla, system-ui, sans-serif; color: #1a1714; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex: 1; background: rgba(26,23,20,0.42);"></div>
  <div style="background: #fbf6ea; border-top: 1.5px dashed #1a1714;">

    <div style="padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 23px;">Edit category</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a1714" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>

    <div style="padding: 20px 20px 0;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; color: #8a8175;">NAME</div>
      <div style="border-bottom: 1.5px solid #1a1714; padding: 7px 0 8px; display: flex; align-items: center; gap: 8px;">
        <span style="flex: 1; font-size: 19px;">Makan</span>
        <span style="width: 1.5px; height: 20px; background: #a03826;"></span>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; line-height: 1.6; color: #a03826; margin-top: 8px;">412 TRANSACTIONS WILL SHOW THE NEW NAME</div>
    </div>

    <div style="padding: 20px 20px 0;">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; color: #8a8175;">ICON &middot; FOOD AND DRINK</div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; margin-top: 10px;">
        <div style="aspect-ratio: 1; border: 1.5px solid #a03826; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a03826" stroke-width="1.6" stroke-linecap="round"><path d="M6 3v8a2 2 0 0 0 4 0V3M8 11v10M18 3c-1.5 1-2 2.5-2 4.5V13h4V7.5c0-2-.5-3.5-2-4.5zM18 13v8"/></svg></div>
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round"><path d="M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8zM16 9h2a2 2 0 0 1 0 4h-2M3 21h14"/></svg></div>
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round"><path d="M3 6c6-3 12-3 18 0L12 21z"/><circle cx="10" cy="10" r="1"/><circle cx="14" cy="13" r="1"/></svg></div>
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-8 8 8 8 0 0 1-8-8z"/><path d="M9 7c0-1.5 1.5-2 1.5-3"/><path d="M14 7c0-1.5 1.5-2 1.5-3"/></svg></div>
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round"><path d="M7 10a5 5 0 0 1 10 0z"/><path d="M6 10l6 11 6-11"/></svg></div>
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.6" stroke-linecap="round"><path d="M6 5h9v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5zM15 8h2.5a1.5 1.5 0 0 1 0 6H15"/></svg></div>
      </div>

      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em; color: #8a8175; margin-top: 16px;">GETTING AROUND</div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px; margin-top: 10px;">
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.5" stroke-linecap="round"><path d="M4 13l1.8-5A2 2 0 0 1 7.7 7h8.6a2 2 0 0 1 1.9 1L20 13v4h-2m-12 0H4v-4"/><circle cx="7.5" cy="16.8" r="1.7"/><circle cx="16.5" cy="16.8" r="1.7"/></svg></div>
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.5" stroke-linecap="round"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M4 10h16M7 20h2M15 20h2"/></svg></div>
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.5" stroke-linecap="round"><path d="M12 3l8 7v4l-8 3-8-3v-4z"/><path d="M12 17v4"/></svg></div>
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="4" width="9" height="16" rx="1.5"/><path d="M7 8h5"/><path d="M14 10h2.5a1.5 1.5 0 0 1 1.5 1.5V16a1.5 1.5 0 0 0 3 0v-4"/></svg></div>
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6l-3-8H8m4 0l3-3"/></svg></div>
        <div style="aspect-ratio: 1; border: 1px solid #ded5c4; border-radius: 2px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b6459" stroke-width="1.5" stroke-linecap="round"><path d="M3 14l9-9 9 9M4 14v6h16v-6"/></svg></div>
      </div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; color: #8a8175; margin-top: 12px;">SEVEN MORE GROUPS BELOW</div>
    </div>

    <div style="padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 11px;">
      <div style="min-height: 52px; background: #a03826; color: #fbf6ea; border-radius: 2px; display: flex; align-items: center; justify-content: center; font-size: 15.5px; font-weight: 500;">Save</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; line-height: 1.6; letter-spacing: 0.04em; color: #8a8175; text-align: center;">USED BY 412 TRANSACTIONS, SO IT CANNOT BE DELETED</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>

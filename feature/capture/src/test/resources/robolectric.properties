# Pinned rather than inherited from targetSdk. Robolectric 4.16.1's highest
# supported image is API 36 (see the catalog comment), and this project's
# emulator is API 37 -- so a targetSdk bump would otherwise make these tests
# fail with an unsupported-SDK error that reads like a Robolectric bug.
#
# That bump has now happened: compileSdk and targetSdk are 37. This file is
# what keeps these tests running, and it is also now the reason they emulate an
# older Android than the app targets. Read the number as a known gap, not as a
# match -- the catalog comment on `robolectric` says what covers it meanwhile.
# It can follow targetSdk once Robolectric 4.17 ships a stable with an
# Android 17 image; 4.17-beta-4 already has one.
sdk=36
